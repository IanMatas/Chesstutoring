services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app:ro
    command: ["python3", "-m", "http.server", "3000", "--bind", "0.0.0.0"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:3000/index.html',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
